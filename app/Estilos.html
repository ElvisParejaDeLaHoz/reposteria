<!-- Estilos de toda la app. Se mete en el <head> de Index.html. -->
  <style>
    :root {
      --papel: #F4EEF2;
      --hoja: #FFFFFF;
      --tinta: #2A2128;
      --suave: #6F636B;
      --linea: #DFD3DA;
      --peonia: #C0245E;
      --peonia-osc: #9A1B4A;
      --peonia-claro: #FBE6EE;
      --tallo: #17382C;
      --tallo-2: #224A3A;
      --eucalipto: #9CC3B4;
      --eucalipto-claro: #E3F0EA;
      --ambar: #F6F1DE;
      --ambar-txt: #5B4A0E;
      --ambar-barra: #C9A93C;
      --azul: #DDE8F3;
      --azul-txt: #1F3F5F;
      --peonia-txt: #6E0F32;
      --peonia-luz: #F3A6C0;
      --peonia-luz2: #F7C3D6;
      --sobre-tallo: #B9D0C5;
      --sobre-tallo-2: #E6F1EB;
      --error: #B3261E;
      --error-btn: #B3261E;
      --error-osc: #8E1F19;
      --error-borde: #E3B5B1;
      --gris-claro: #F1ECEF;
      --linea-fuerte: #C9B9C2;
      --placeholder: #A89CA4;
      --tallo-txt: #17382C;
      --acento: #C0245E;
      --titulos: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
      --texto: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
    }

    :root[data-tema="oscuro"] {
      color-scheme: dark;
      --papel: #141114;
      --hoja: #1F1B1F;
      --tinta: #F1EAEE;
      --suave: #B8ADB5;
      --linea: #3B343A;
      --linea-fuerte: #5A505A;
      --placeholder: #8E8290;
      --gris-claro: #2C272C;
      --ambar: #3A3216;
      --ambar-txt: #F0DFA0;
      --azul: #1F3349;
      --azul-txt: #BCD7F2;
      --error: #FF8F86;
      --error-borde: #6B2E2A;
    }
    :root[data-tema="oscuro"] .logo-login, :root[data-tema="oscuro"] .logo-cab { background: #fff; padding: 6px 10px; border-radius: 12px; }
    .sesion-acc { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
    .campana { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 1.5px solid var(--linea-fuerte); background: transparent; color: var(--tinta); cursor: pointer; }
    .campana svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .campana .raya { display: none; }
    .campana[aria-pressed="false"] { color: var(--suave); }
    .campana[aria-pressed="false"] .raya { display: inline; }
    .campana:focus-visible { outline: 3px solid color-mix(in srgb, var(--peonia) 35%, transparent); outline-offset: 2px; }
    .tab-punto { position: absolute; top: 6px; right: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--peonia); border: 2px solid var(--hoja); animation: latido 1.6s ease-in-out infinite; }
    .tab-punto[hidden] { display: none; }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) { .tab-punto { animation: none; } }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--papel);
      color: var(--tinta);
      font-family: var(--texto);
      font-size: 1rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2 { font-family: var(--titulos); margin: 0; letter-spacing: -0.015em; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    legend { padding: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .marca { margin: 0 0 6px; font-weight: 700; font-size: .9rem; letter-spacing: .02em; color: var(--acento); }
    .entrada .lema { margin: 8px 0 0; color: var(--suave); }
    .entrada .lema + .sub { margin-top: 4px; }

    /* ---------- Cabecera ---------- */
    .top {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px 32px;
      flex-wrap: wrap;
    }
    .top h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.05; font-weight: 700; }
    .top p { margin: 8px 0 0; color: var(--suave); max-width: 52ch; }
    .sesion { display: flex; align-items: center; gap: 14px; }
    .sesion-quien { text-align: right; line-height: 1.25; }
    .sesion-quien b { display: block; }
    .sesion-quien span { font-size: .86rem; color: var(--suave); }
    .enlace {
      font: inherit;
      font-weight: 600;
      color: var(--tallo-txt);
      background: transparent;
      border: 0;
      border-bottom: 2px solid var(--eucalipto);
      padding: 2px 0;
      cursor: pointer;
    }
    .enlace:hover { border-bottom-color: var(--tallo-txt); }
    .enlace:focus-visible { outline: 3px solid color-mix(in srgb, var(--peonia) 35%, transparent); outline-offset: 4px; border-radius: 2px; }

    /* ---------- Pestañas ---------- */
    .tabs { max-width: 1120px; margin: 0 auto; padding: 0 20px 22px; display: flex; flex-wrap: wrap; gap: 0 24px; }
    .tab {
      font: inherit;
      font-weight: 700;
      font-size: 1.02rem;
      color: var(--suave);
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 10px 2px;
      min-height: 46px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .tab-icono { display: none; }
    .tab-icono svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab:hover { color: var(--tinta); }
    .tab[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--acento); }
    .tab:focus-visible { outline: 3px solid color-mix(in srgb, var(--peonia) 35%, transparent); outline-offset: 2px; border-radius: 4px; }
    .tab-cuenta {
      min-width: 24px;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--peonia);
      color: #fff;
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Entrada ---------- */
    .cargando { min-height: 60vh; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 0 24px; text-align: center; color: var(--suave); font-weight: 600; }
    .cargando p { margin: 0; max-width: 340px; }
    /* Círculo que gira: se usa en la entrada y en botones mientras se espera al servidor. */
    .girando { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; vertical-align: -3px; animation: girar .8s linear infinite; }
    .girando.grande { width: 38px; height: 38px; border-width: 3.5px; color: var(--peonia); }
    @keyframes girar { to { transform: rotate(360deg); } }
    /* Barra fina arriba mientras la app espera a Google (aparece si la espera pasa de un tercio de segundo). */
    .barra-carga { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; pointer-events: none; opacity: 0; transition: opacity .2s;
      background: linear-gradient(90deg, transparent, var(--peonia), transparent) no-repeat; background-size: 40% 100%; animation: barrido 1.1s ease-in-out infinite; }
    .barra-carga.ver { opacity: 1; }
    @keyframes barrido { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    .entrada { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .entrada .tag-wrap { width: min(100%, 420px); }
    .entrada h1 { font-size: 2rem; line-height: 1.05; }
    .logo-login { display: block; width: auto; height: auto; max-width: 220px; max-height: 110px; margin: 0 0 20px; object-fit: contain; }
    .logo-cab { display: block; width: auto; height: auto; max-width: 200px; max-height: 52px; margin: 0 0 14px; object-fit: contain; }
    .entrada .sub { margin: 8px 0 24px; color: var(--suave); }

    /* ---------- Etiqueta (formularios) ---------- */
    .tag-wrap { filter: drop-shadow(0 8px 20px rgba(42, 33, 40, .09)); }
    .tag {
      position: relative;
      background: var(--hoja);
      padding: 40px 36px 32px;
      clip-path: polygon(34px 0, 100% 0, 100% 100%, 0 100%, 0 34px);
    }
    .tag::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--papel);
      box-shadow: inset 0 1px 2px rgba(42, 33, 40, .25);
    }
    .grupo + .grupo { margin-top: 30px; padding-top: 30px; border-top: 1.5px dashed var(--linea); }
    .grupo > h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 16px; }
    .pila { display: grid; gap: 18px; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ---------- Campos ---------- */
    .campo { display: grid; gap: 6px; align-content: start; }
    .etq { font-weight: 600; font-size: .92rem; display: block; }
    .ayuda { margin: 0; font-size: .85rem; color: var(--suave); }
    .ctl {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      color: var(--tinta);
      background: var(--hoja);
      border: 1.5px solid var(--linea);
      border-radius: 10px;
      padding: 12px 14px;
      min-height: 48px;
    }
    textarea.ctl { resize: vertical; min-height: 120px; line-height: 1.45; }
    .ctl::placeholder { color: var(--placeholder); }
    .ctl:hover { border-color: var(--linea-fuerte); }
    .ctl:focus-visible { outline: 3px solid color-mix(in srgb, var(--peonia) 26%, transparent); border-color: var(--acento); }
    .msg { display: none; margin: 0; font-size: .86rem; color: var(--error); font-weight: 500; }
    .campo.err > .msg { display: block; }
    .campo.err > .ctl, .campo.err .ctl { border-color: var(--error); }
    .campo.err .seg span { border-color: var(--error); }
    .error-form { margin: 0 0 16px; padding: 10px 12px; border-radius: 10px; background: var(--peonia-claro); color: var(--peonia-txt); font-weight: 600; font-size: .93rem; }

    .dinero { position: relative; }
    .dinero b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 600; color: var(--suave); pointer-events: none; }
    .dinero .ctl { padding-left: 30px; font-variant-numeric: tabular-nums; }

    .seg { display: flex; flex-wrap: wrap; gap: 8px; }
    .seg label { position: relative; }
    .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .seg span {
      display: block;
      padding: 11px 18px;
      border: 1.5px solid var(--linea);
      border-radius: 999px;
      background: var(--hoja);
      font-weight: 600;
      line-height: 1.2;
    }
    .seg label:hover span { border-color: var(--tallo-2); }
    .seg input:checked + span { background: var(--tallo); border-color: var(--tallo-txt); color: #fff; }
    .seg input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--peonia) 40%, transparent); outline-offset: 2px; }

    /* ---------- Aviso de turno ---------- */
    .aviso {
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 4px solid var(--eucalipto);
      background: var(--eucalipto-claro);
      color: var(--tallo-txt);
      font-size: .93rem;
    }
    .aviso strong { font-weight: 700; }
    .aviso.mismo { background: var(--ambar); border-left-color: var(--ambar-barra); color: var(--ambar-txt); }

    /* ---------- Total y botones ---------- */
    .cierre {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1.5px dashed var(--linea);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px 28px;
      flex-wrap: wrap;
    }
    .total small { display: block; color: var(--suave); font-size: .85rem; font-weight: 500; }
    .total output { display: block; font-family: var(--titulos); font-weight: 700; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .guardar {
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      background: var(--peonia);
      border: 0;
      border-radius: 12px;
      padding: 15px 28px;
      min-height: 54px;
      cursor: pointer;
      transition: background-color .15s;
    }
    .guardar:hover { background: var(--peonia-osc); }
    .guardar:focus-visible { outline: 3px solid color-mix(in srgb, var(--peonia) 40%, transparent); outline-offset: 3px; }
    .guardar:disabled { opacity: .55; cursor: not-allowed; }
    .guardar.ancho { width: 100%; }

    .btn-sec {
      font: inherit;
      font-weight: 600;
      color: var(--tallo-txt);
      background: transparent;
      border: 1.5px solid var(--eucalipto);
      border-radius: 999px;
      padding: 10px 18px;
      min-height: 46px;
      cursor: pointer;
    }
    .btn-sec:hover { border-color: var(--tallo-txt); }
    .btn-sec:disabled { opacity: .6; cursor: progress; }
    .btn-sec:focus-visible { outline: 3px solid color-mix(in srgb, var(--peonia) 35%, transparent); outline-offset: 2px; }

    /* ---------- Turnos del día (al tomar pedido) ---------- */
    .layout { max-width: 1120px; margin: 0 auto; padding: 0 20px 96px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; align-items: start; }
    .dia { position: sticky; top: 20px; background: var(--tallo); color: var(--sobre-tallo-2); border-radius: 20px; padding: 26px 24px 20px; }
    .dia-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .dia h2 { color: #fff; font-size: 1.3rem; font-weight: 700; }
    .dia-cuenta { font-size: .88rem; color: var(--eucalipto); font-weight: 600; white-space: nowrap; }
    .dia-fecha { margin: 4px 0 0; color: var(--sobre-tallo); }
    .lista { list-style: none; margin: 18px 0 0; padding: 0; max-height: 62vh; overflow-y: auto; }
    .item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 12px; padding: 13px 10px; border-top: 1px solid rgba(255, 255, 255, .13); }
    .item .n {
      grid-row: span 3;
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .14);
      color: #fff;
      font-family: var(--titulos);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .item .hora { font-family: var(--titulos); font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
    .item .quien { font-weight: 600; color: #fff; }
    .item .quien i { font-style: normal; font-weight: 400; color: var(--sobre-tallo); }
    .item .det { margin: 0; font-size: .88rem; color: var(--sobre-tallo); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item.mismo { box-shadow: inset 3px 0 0 var(--ambar-barra); }
    .item.nuevo { border: 1.5px dashed var(--peonia-luz); border-radius: 12px; background: color-mix(in srgb, var(--peonia-luz) 10%, transparent); margin: 6px 0; animation: entra .22s ease-out; }
    .item.nuevo .n { background: var(--peonia); }
    .item.nuevo .hora, .item.nuevo .quien { color: var(--peonia-luz2); }
    .item.vacio { display: block; color: var(--sobre-tallo); padding: 18px 10px 8px; }
    @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ---------- Vistas de lista (seguimiento, decorador, entregas) ---------- */
    .deco { max-width: 760px; margin: 0 auto; padding: 0 20px 96px; }
    .deco-barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; }
    .barra-filtros { display: flex; flex-wrap: wrap; gap: 12px 24px; }

    .progreso { background: var(--hoja); border-radius: 16px; padding: 16px 18px 18px; margin-bottom: 20px; }
    .progreso p { margin: 0 0 10px; font-weight: 600; }
    .pista { height: 10px; border-radius: 999px; background: var(--eucalipto-claro); overflow: hidden; }
    .pista i { display: block; height: 100%; width: 0; background: var(--tallo); border-radius: 999px; transition: width .35s ease; }

    .hoja-deco { background: var(--hoja); border-radius: 16px; overflow: hidden; }
    .hoja-deco + .hoja-deco { margin-top: 16px; }
    .fecha-grupo { margin: 0; padding: 10px 18px; background: var(--tallo); color: #fff; font-family: var(--titulos); font-size: 1rem; font-weight: 700; }
    .fecha-grupo.atrasado { background: var(--peonia); }
    .tareas { list-style: none; margin: 0; padding: 0; }
    .tarea { display: grid; grid-template-columns: 84px 1fr; gap: 6px 14px; padding: 18px; }
    .tarea + .tarea { border-top: 1.5px dashed var(--linea); }
    .tarea.siguiente { background: var(--peonia-claro); }
    .tarea-izq { display: grid; justify-items: center; align-content: start; gap: 8px; }
    .turno {
      width: 64px;
      padding: 6px 0 8px;
      border-radius: 14px;
      background: var(--tallo);
      color: #fff;
      text-align: center;
      line-height: 1;
    }
    .turno small { display: block; font-size: .72rem; font-weight: 600; opacity: .85; margin-bottom: 4px; }
    .turno b { font-family: var(--titulos); font-size: 1.7rem; font-variant-numeric: tabular-nums; }
    .tarea.siguiente .turno { background: var(--peonia); }
    .tarea-hora { font-family: var(--titulos); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; text-align: center; font-size: .98rem; }
    .tarea-para { margin: 0; font-weight: 700; font-size: 1.08rem; }
    .tarea-para span { font-weight: 400; font-size: .9rem; color: var(--suave); }
    .tarea-desc { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 62ch; }
    .tarea-ded { margin: 12px 0 0; padding: 10px 12px; background: var(--peonia-claro); border-radius: 10px; color: var(--peonia-txt); white-space: pre-wrap; overflow-wrap: anywhere; }
    .tarea.siguiente .tarea-ded { background: var(--hoja); }
    .tarea-ded b { display: block; font-size: .85rem; margin-bottom: 2px; }
    .tarea-dir { margin: 8px 0 0; font-weight: 600; overflow-wrap: anywhere; }
    .tarea-dir a { color: var(--tallo-txt); font-weight: 600; margin-left: 8px; font-size: .92rem; }
    .tarea-meta { margin: 10px 0 0; font-size: .88rem; font-weight: 600; color: var(--suave); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .tarea-meta .tarde { color: var(--acento); }
    .tarea-rastro { margin: 8px 0 0; font-size: .9rem; color: var(--suave); }
    .acciones { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 14px; }
    .tarea-btn {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--tallo);
      border: 1.5px solid var(--tallo);
      border-radius: 12px;
      padding: 12px 20px;
      min-height: 50px;
      cursor: pointer;
    }
    .tarea-btn:hover { background: var(--tallo-2); }
    .tarea-btn.deshacer { background: transparent; color: var(--tallo-txt); border-color: var(--eucalipto); }
    .tarea-btn.deshacer:hover { border-color: var(--tallo-txt); }
    .tarea-btn:disabled { opacity: .6; cursor: progress; }
    .tarea-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--peonia) 40%, transparent); outline-offset: 2px; }
    .tarea.hecho .tarea-para, .tarea.hecho .tarea-desc, .tarea.hecho .tarea-hora { color: var(--suave); }
    .tarea.hecho .tarea-ded { background: var(--gris-claro); color: var(--suave); }
    .deco-vacio { background: var(--hoja); border-radius: 16px; padding: 32px 22px; text-align: center; }
    .deco-vacio strong { display: block; font-family: var(--titulos); font-size: 1.25rem; margin-bottom: 6px; }
    .deco-vacio p { margin: 0; color: var(--suave); }

    /* ---------- Estados ---------- */
    .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; line-height: 1.4; }
    .chip.pendiente { background: var(--peonia-claro); color: var(--peonia-txt); }
    .chip.preparacion { background: var(--ambar); color: var(--ambar-txt); }
    .chip.listo { background: var(--eucalipto-claro); color: var(--tallo-txt); }
    .chip.camino { background: var(--azul); color: var(--azul-txt); }
    .chip.entregado { background: var(--tallo); color: #fff; }
    .tarea.siguiente .chip.pendiente { background: var(--hoja); }

    .ctl:disabled { background: var(--gris-claro); color: var(--suave); cursor: not-allowed; }
    .seg input:disabled { cursor: not-allowed; }
    .seg input:disabled + span { opacity: .55; }
    .seg input:disabled:checked + span { opacity: .85; }
    .tarea-btn.peligro { background: transparent; color: var(--error); border-color: var(--error-borde); }
    .tarea-btn.peligro:hover { border-color: var(--error); background: transparent; }
    .guardar.peligro { background: var(--error-btn); }
    .guardar.peligro:hover { background: var(--error-osc); }
    .mod { background: var(--ambar); color: var(--ambar-txt); padding: 2px 10px; border-radius: 999px; font-weight: 700; }
    .nota-edicion { margin: 0 0 24px; padding: 12px 14px; border-radius: 10px; border-left: 4px solid var(--ambar-barra); background: var(--ambar); color: var(--ambar-txt); font-size: .93rem; }
    .nota-edicion strong { display: block; }
    .contacto a { color: var(--tallo-txt); font-weight: 600; margin: 0 14px 0 0; }
